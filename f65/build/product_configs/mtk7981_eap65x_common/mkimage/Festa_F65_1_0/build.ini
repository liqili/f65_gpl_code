# This additional_hw_version is the actual hardware version of this model used to generate additional-hardversion.bin.
# If you want to change the hardware version of this model, first you need to change this additional_hw_version.
# Then modify the additional_hw_version in /common/build.ini to ensure that it is the maximum hardware version for all co-edition models.
#
# Festa F65 v1 is the same hardware as EAP653 v2 (identical device tree). Its factory add-hardver is 0001
# (see the stock Festa F65 GPL build.ini), so keep it here.
additional_hw_version = 0001
secure_version=1
