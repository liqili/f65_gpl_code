[build]
output_folder = "output"
model_name = "Festa_F65_1_0,EAP650_2_0,EAP653_2_0,EAP653_UR_1_0,EAP653_UR_2_0,EAP650-Wall_2_0,EAP655-WE-AC_1_0,EAP655-WE_1_0,EAP650_3_0,EAP653_3_0"
build_type = "release"
up_header_type = encrypt_proInfo
flash_size = 16MB
# These three values end up in soft-version.bin, which is installed as /fw_data/soft-version and is
# what nm_fwup_verifyFwupFile reads back as the CURRENT versions when the next image is uploaded.
# It refuses an upload unless
#     additional_hw_version(new) >= additional_hw_version(installed)
#     secure_version(new)        >= secure_version(installed)
#     soft_version(new)          != soft_version(installed)
# so an image built here decides what the device will still accept afterwards. They are set to the
# values the shipped Festa F65 1.0.2 firmware declares (hardware 2, secure 0), which keeps the stock
# firmware installable over a build from this tree. The vendor EAP650 GPL tree shipped 1-4-90 /
# 0003 / 1; a device that has one of those installed will refuse anything lower, so it has to be
# brought back below those values outside the web upgrade path before this image will go on.
#
# soft_version must differ from the installed one, so it cannot be 1-0-2 itself or the stock image
# would be refused as "the softver of the firmware is the same".
soft_version = 1-0-3
# This additional_hw_version is the common hardware version of the co-edition models used to generate soft-version.bin.
# And it should be set to the maximum hardware version of all co-edition models.
# The additional_hw_version of each co-edition model need to be set in the build.ini under their respective model's directory.
# Festa F65 v1 is hardware 2, and that is the only model this tree is built for; raising this to the
# co-edition maximum (3) would lock the device out of the stock F65 firmware.
additional_hw_version = 0002
secure_version=0
boot_version=0
uboot_version=1
fw_bin_format=%model_name%_%fw_ver_major%.%fw_ver_minor%.%fw_ver_revision%_[%build_date%-rel%build_seconds%]_%bin_type%.bin
[auxiliaries]
ptn_tbl_item_separator="\n"
append_null_each_ptn=FALSE
image_file_name_backup=vxWorks
