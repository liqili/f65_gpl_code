[rootfs]
# Volume mode (other option is static)
mode=ubi
# Source image
image=../../squashfs
# Volume ID in UBI image
vol_id=0
# Allow for dynamic resize
vol_type=static
# Volume name
vol_name=rootfs

[kernel]
# Volume mode (other option is static)
mode=ubi
# Source image
image=../../mt7981-spim-nand-rfb-kernel.bin
# Volume ID in UBI image
vol_id=1
# Allow for dynamic resize
vol_type=static
# Volume name
vol_name=kernel

